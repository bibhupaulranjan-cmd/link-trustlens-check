name: Verify Netlify build

on:
  push:

permissions:
  contents: read

jobs:
  build:
    name: Build TanStack Start for Netlify
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build application
        run: bun run build

      - name: Verify Netlify deployment output
        run: |
          test -d dist/client || { echo "Missing Netlify publish directory: dist/client"; exit 1; }
          test -s .netlify/v1/functions/server.mjs || { echo "Missing Netlify server function output: .netlify/v1/functions/server.mjs"; exit 1; }